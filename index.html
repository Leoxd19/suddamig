<style>
@font-face{font-family:'Familjen Grotesk';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/familjen-grotesk-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Familjen Grotesk';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/familjen-grotesk-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Familjen Grotesk';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/familjen-grotesk-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
/* Layout: one narrow column. Solid outlined cards, slim sticky progress, three identical segmented toggles, the Sudd eraser as mascot. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#0B1220; --muted:#4A5468;
  --accent:#2541E8; --on-accent:#FFFFFF;
  --done:#0B7A43; --on-done:#FFFFFF;
  --warn:#FFD43B; --on-warn:#0B1220;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --line:#0B1220; --sel:#0B1220; --on-sel:#EDF0F4; --link:#2541E8;
  --soft:#2A3344; --tint:#E2E7FB; --tint-line:#0B1220;
  --b:2px solid var(--line); --r:8px;
}
/* Light is the default for everyone. Dark only applies when the visitor picks it. */
:root[data-theme="dark"]{
  --bg:#12161F; --surface:#1B212D; --ink:#E8EBF1; --muted:#B3BBC9;
  --accent:#8EA2FF; --on-accent:#0B1220; --done:#4CD787; --on-done:#0B1220;
  --warn:#F2CD52; --on-warn:#14110A;
  --line:#4A5470; --sel:#8EA2FF; --on-sel:#0B1220; --link:#A9B8FF;
  --soft:#D5DAE4; --tint:#1E2640; --tint-line:#56619A;
  color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--display);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:20px 72px}
.wrap{max-width:680px;margin:0 auto;display:grid;gap:36px}
.wrap>*{min-width:0}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.08}
h1{font-size:clamp(2rem,8.2vw,3.5rem);overflow-wrap:break-word;hyphens:manual;font-weight:700;letter-spacing:-.025em}
h2{font-size:.95rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;display:flex;gap:10px;align-items:baseline}
h2 small{font-size:.8rem;color:var(--muted);letter-spacing:.06em}
p{margin:0}
b,strong{font-weight:700}
section{display:grid;gap:14px}
.sudd{display:block;overflow:visible}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mark{font-weight:700;font-size:1.2rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.mark .sudd{width:38px;height:30px}
.toggles{display:flex;gap:8px;flex-wrap:wrap}

/* segmented toggle: one component, used three times */
.seg{display:inline-flex;border:var(--b);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{font:700 .9rem var(--display);padding:7px 12px;border:0;background:transparent;color:var(--ink);cursor:pointer;min-width:44px}
.seg button+button{border-left:var(--b)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--on-sel)}
.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:-5px}

/* hero */
.hero{display:grid;gap:16px}
.stamp{font:500 .82rem var(--mono);color:var(--muted)}
.hero-head{display:grid;grid-template-columns:1fr auto;grid-template-areas:"stamp sudd" "title title";column-gap:16px;row-gap:10px;align-items:end}
.hero-head .stamp{grid-area:stamp;align-self:center}
.hero-head .sudd{grid-area:sudd}
.hero-head h1{grid-area:title;min-width:0}
@media (max-width:639px){.hero .sudd{width:58px;margin:0}.hero-head .stamp{font-size:.74rem}}
@media (min-width:640px){.hero-head{grid-template-areas:"stamp sudd" "title sudd";row-gap:14px}.hero-head .stamp{align-self:end}.hero-head .sudd{align-self:end}}
.lead{font-size:1.15rem;line-height:1.6;color:var(--soft);max-width:56ch}
.lead strong{color:var(--ink)}
.hero .sudd{width:clamp(72px,19vw,140px);height:auto;transform-origin:30% 90%;margin-bottom:4px}
.hero .sudd.rub{animation:rub 1.1s ease-in-out .4s 1}
@keyframes rub{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-3deg)}45%{transform:translateX(9px) rotate(2deg)}70%{transform:translateX(-6px) rotate(-2deg)}}

/* intro */
.intro{gap:14px;background:var(--tint);border:var(--b);border-color:var(--tint-line);border-radius:var(--r);padding:22px 22px 24px}
.intro-body{display:grid;gap:12px;max-width:58ch}
.intro-body p{font-size:1.05rem;line-height:1.65;color:var(--soft)}
.intro-body .first{font-size:1.35rem;line-height:1.3;font-weight:700;color:var(--ink);letter-spacing:-.01em;text-wrap:balance}

/* bankid question */
.ask{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:var(--b);border-radius:var(--r);padding:12px 12px 12px 16px}
.ask p{font-weight:700}

/* progress: slim and sticky */
.progress{background:var(--surface);border:var(--b);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.count{font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{flex:1;height:12px;border:var(--b);border-radius:99px;overflow:hidden;background:var(--bg);min-width:60px}
.bar>i{display:block;height:100%;width:0;background:var(--done);transition:width .3s}
.finished{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--done);color:var(--on-done);border:var(--b);border-color:var(--done);border-radius:var(--r);padding:14px 18px}
.finished .sudd{width:76px;height:auto}
.finished p+p{margin-top:2px}
.finished .big{font-weight:700;font-size:1.3rem}

/* cards */
.list{display:grid;gap:14px;list-style:none;margin:0;padding:0}
.card{background:var(--surface);border:var(--b);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0}
.head{display:flex;align-items:center;gap:14px}
.num{flex:none;width:40px;height:40px;border:var(--b);border-radius:var(--r);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.head h3{font-size:1.5rem;font-weight:700;flex:1;min-width:0}
.pill{font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:var(--b);border-radius:99px;padding:4px 11px 4px 9px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.steps{margin:0;padding-left:1.4em;display:grid;gap:8px;line-height:1.55}
.steps li{padding-left:2px}
.steps li::marker{font-weight:700}
.note{border:var(--b);border-radius:var(--r);padding:12px 14px;background:var(--bg);font-size:.97rem;line-height:1.55;display:grid;gap:4px;color:var(--soft)}
.note b{color:var(--ink)}
.note.warn{background:var(--warn);color:var(--on-warn);border-color:var(--on-warn)}
.note.warn b{color:var(--on-warn)}
.note .lbl{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;display:block}
.ops{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:0;border:var(--b);border-radius:var(--r);padding:14px 16px;line-height:1.5}
.ops dt{font-weight:700}
.ops dd{margin:0;min-width:0;color:var(--soft)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:700 1rem var(--display);display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border:var(--b);border-radius:var(--r);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer;overflow-wrap:anywhere;transition:transform .12s,box-shadow .12s}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--line)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--line)}
.btn:active{transform:none;box-shadow:none}
.btn:focus-visible,.copy:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mail{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;border:var(--b);border-radius:var(--r);padding:6px 6px 6px 12px;min-width:0;max-width:100%}
.mail code{font:500 .92rem var(--mono);user-select:all;overflow-wrap:anywhere}
.copy{font:700 .85rem var(--display);border:var(--b);border-radius:6px;background:var(--sel);color:var(--on-sel);padding:4px 10px;cursor:pointer}

/* done toggle with a real box */
.check .box{width:20px;height:20px;border:2px solid currentColor;border-radius:5px;display:grid;place-items:center;flex:none}
.check .box::after{content:"";width:6px;height:11px;border:solid currentColor;border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg);opacity:0}
.check[aria-pressed="true"]{background:var(--done);color:var(--on-done);border-color:var(--done)}
.check[aria-pressed="true"] .box::after{opacity:1}
.check.small{padding:6px 12px;font-size:.92rem;gap:8px}
.check.small .box{width:18px;height:18px}

.card.is-done{border-color:var(--done);padding-block:14px}
.card.is-done .num{background:var(--done);color:var(--on-done);border-color:var(--done)}
.card.is-done .pill{border-color:var(--done);color:var(--done)}
.card.is-done .body{display:none}
.body{display:grid;gap:14px}

/* plain lists */
.plain{list-style:none;margin:0;padding:0;display:grid;background:var(--surface);border:var(--b);border-radius:var(--r)}
.plain li{padding:16px 18px;line-height:1.55;color:var(--soft)}
.plain li b{color:var(--ink)}
.plain li+li{border-top:var(--b)}
.plain a{color:var(--link);font-weight:700}

/* template */
.tpl{display:grid;gap:12px;line-height:1.55;background:var(--surface);border:var(--b);border-radius:var(--r);padding:18px}
.tpl h3{font-size:1.2rem}
.tpl pre{margin:0;font:500 .88rem/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:var(--b);border-radius:var(--r);padding:14px}

.faq{display:grid;gap:12px}
details{background:var(--surface);border:var(--b);border-radius:var(--r);padding:16px 18px}
details>div{max-width:60ch;color:var(--soft);line-height:1.65}
summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.4rem;line-height:1;font-weight:400;flex:none}
details[open] summary::after{content:"\2212"}
details[open] summary{margin-bottom:12px}
details p+p{margin-top:10px}

.foot{display:grid;gap:14px;color:var(--soft);font-size:.97rem;line-height:1.55;border-top:var(--b);padding-top:24px}
.foot strong{color:var(--ink)}
.foot a{color:var(--link);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.btn:hover{transform:none}}
@media (max-width:480px){.ops{grid-template-columns:1fr;gap:2px}.ops dd+dt{margin-top:10px}}
@media (max-width:420px){.head h3{font-size:1.3rem}.card{padding:16px}.intro{padding:18px 18px 20px}.intro-body .first{font-size:1.25rem}.top .seg button{padding:6px 9px;min-width:0;font-size:.85rem}.toggles{gap:6px}.mark{font-size:1.08rem}.mark .sudd{width:32px;height:26px}}
</style>

/* ---------- state ---------- */
const KEY = "tabortmig:v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
let state = Object.assign({mode:"bankid",done:{},lang:"sv",theme:null}, load());
if(!state.done) state.done = {};

const L = v => (v && typeof v === "object" && !Array.isArray(v) && ("sv" in v)) ? v[state.lang] : v;
const currentTheme = () => state.theme === "dark" ? "dark" : "light";

/* ---------- render ---------- */
function card(item, n){
  const v = item.all || item[state.mode];
  const noBank = state.mode === "nobankid" && item.tagNo;
  const done = !!state.done[item.id];
  const li = document.createElement("li");
  li.className = "card" + (done ? " is-done" : "");
  if(done){
    li.innerHTML = `<div class="head"><span class="num" aria-hidden="true">✓</span><h3>${L(item.name)}</h3><button type="button" class="btn check small" data-id="${item.id}" aria-pressed="true" aria-label="${L(T.done)}: ${L(item.name)}"><span class="box" aria-hidden="true"></span><span>${L(T.done)}</span></button></div>`;
    return li;
  }
  let h = `<div class="head"><span class="num" aria-hidden="true">${done ? "✓" : n}</span><h3>${L(item.name)}</h3><span class="pill">${noBank ? icon(item.iconNo) + L(item.tagNo) : icon(item.icon) + L(item.tag)}</span></div><div class="body">`;
  h += `<ol class="steps">${L(v.steps).map(s=>`<li>${s}</li>`).join("")}</ol>`;
  const ops = v.ops || item.ops;
  if(ops) h += `<dl class="ops">${L(ops).map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>`;
  if(item.warn) h += `<div class="note warn"><span class="lbl">${L(T.obs)}</span><p>${L(item.warn)}</p></div>`;
  if(item.note) h += `<div class="note"><span class="lbl">${L(T.tip)}</span><p>${L(item.note)}</p></div>`;
  if(v.link || v.email){
    h += `<div class="actions">`;
    if(v.link) h += `<a class="btn primary" href="${v.link[0]}" target="_blank" rel="noopener">${L(v.link[1])} ↗</a>`;
    if(v.email) h += `<span class="mail"><code>${v.email}</code><button type="button" class="copy" data-copy="${v.email}">${L(T.copy)}</button></span>`;
    h += `</div>`;
  }
  h += `</div><div class="actions"><button type="button" class="btn check" data-id="${item.id}" aria-pressed="${done}" aria-label="${L(T.markDone)}: ${L(item.name)}"><span class="box" aria-hidden="true"></span><span>${done ? L(T.done) : L(T.markDone)}</span></button></div>`;
  li.innerHTML = h;
  return li;
}

function render(){
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = L(T[el.dataset.i18n]); });
  document.getElementById("sites").replaceChildren(...SITES.map((x,i)=>card(x,i+1)));
  document.getElementById("after").replaceChildren(...AFTER.map((x,i)=>card(x,SITES.length+i+1)));
  document.getElementById("stay").innerHTML = L(T.stay).map(s=>`<li><span>${s}</span></li>`).join("");
  document.getElementById("mail").innerHTML = L(T.mail).map(s=>`<li><span>${s}</span></li>`).join("");
  document.getElementById("tpl").textContent = L(T.tpl);
  const n = [...SITES,...AFTER].filter(x=>state.done[x.id]).length;
  document.getElementById("count").textContent = n === TOTAL ? L(T.allDone) : L(T.count)(n);
  document.getElementById("bar").style.width = (n/TOTAL*100) + "%";
  document.getElementById("finished").hidden = n !== TOTAL;
  document.querySelectorAll("#seg-lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===state.lang));
  document.querySelectorAll("#seg-mode button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.mode===state.mode));
  document.querySelectorAll("#seg-theme button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.themeSet===currentTheme()));
  document.getElementById("seg-theme").setAttribute("aria-label", state.lang==="sv" ? "Tema" : "Theme");
  document.getElementById("seg-mode").setAttribute("aria-label", L(T.askBankid));
  resetIdle();
}

function applyTheme(){
  const t = currentTheme();
  document.documentElement.setAttribute("data-theme", t);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = t === "dark" ? "#12161F" : "#EDF0F4";
}

/* ---------- copy ---------- */
function copyText(text, btn, okLabel, idleLabel, selectEl){
  const ok = () => { btn.textContent = okLabel; setTimeout(()=>btn.textContent = idleLabel, 1600); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(selectEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try{ navigator.clipboard.writeText(text).then(ok, fallback); }catch(e){ fallback(); }
}

/* ---------- calendar reminder ---------- */
function downloadReminder(){
  const d = new Date(); d.setDate(d.getDate()+182);
  const ymd = x => x.getFullYear()+String(x.getMonth()+1).padStart(2,"0")+String(x.getDate()).padStart(2,"0");
  const end = new Date(d); end.setDate(end.getDate()+1);
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const esc = s => s.replace(/[\\;,]/g, m => "\\"+m);
  const fold = line => { const out = []; let cur = ""; for(const ch of line){ if(new TextEncoder().encode(cur+ch).length > (out.length ? 74 : 75)){ out.push(cur); cur = ch; } else cur += ch; } out.push(cur); return out.join("\r\n "); };
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Sudda mig//SV","BEGIN:VEVENT",
    "UID:"+Date.now()+"@suddamig","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+ymd(d),"DTEND;VALUE=DATE:"+ymd(end),
    "SUMMARY:"+esc(L(T.icsTitle)),"DESCRIPTION:"+esc(L(T.icsDesc)),"URL:"+location.href.split("#")[0],
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+esc(L(T.icsTitle)),"TRIGGER:PT9H","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].map(fold).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  a.download = "sudda-mig-paminnelse.ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  const chk = t.closest(".check");
  if(chk){ const id = chk.dataset.id; state.done[id] = !state.done[id]; save(); render(); const again = document.querySelector(`.check[data-id="${id}"]`); if(again) again.focus({preventScroll:true}); return; }
  const cp = t.closest(".copy");
  if(cp){ copyText(cp.dataset.copy, cp, L(T.copied), L(T.copy), cp.previousElementSibling); return; }
  const lb = t.closest("[data-lang]");
  if(lb){ state.lang = lb.dataset.lang; save(); render(); return; }
  const mb = t.closest("[data-mode]");
  if(mb){ state.mode = mb.dataset.mode; save(); render(); return; }
  const tb = t.closest("[data-theme-set]");
  if(tb){ state.theme = tb.dataset.themeSet; save(); applyTheme(); render(); return; }
  if(t.closest(".remind")){ downloadReminder(); return; }
  if(t.id === "tpl-copy"){ copyText(L(T.tpl), t, L(T.tplCopied), L(T.tplCopy), document.getElementById("tpl")); }
});

const resetBox = document.getElementById("reset");
function resetIdle(){
  resetBox.innerHTML = `<button type="button" class="btn" id="reset-ask">${L(T.reset)}</button>`;
  document.getElementById("reset-ask").onclick = resetConfirm;
}
function resetConfirm(){
  resetBox.innerHTML = `<strong>${L(T.resetQ)}</strong><button type="button" class="btn primary" id="reset-yes">${L(T.resetYes)}</button><button type="button" class="btn" id="reset-no">${L(T.cancel)}</button>`;
  document.getElementById("reset-yes").onclick = () => { state.done = {}; save(); render(); window.scrollTo({top:0}); };
  document.getElementById("reset-no").onclick = resetIdle;
}

applyTheme();
render();
</script>
